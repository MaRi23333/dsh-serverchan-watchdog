<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">dsh-serverchan-watchdog</title>
  <desc id="desc">DeepSeek Harness 人工确认超时后通过 Server酱发送手机提醒</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#4d6bfe" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#bg)" stroke="#dfe6fb"/>

  <!-- Original generic bell-and-clock mark; not a ServerChan logo. -->
  <g transform="translate(82 76)" filter="url(#soft-shadow)">
    <rect width="112" height="112" rx="26" fill="#4d6bfe"/>
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 66h42c-6-7-8-15-8-25 0-13-8-22-20-22S25 28 25 41c0 10-2 18-8 25h14" stroke-width="6"/>
      <path d="M37 76c2 8 13 8 16 0" stroke-width="6"/>
      <circle cx="76" cy="76" r="21" fill="#fff" stroke="#4d6bfe" stroke-width="5"/>
      <path d="M76 65v12l8 5" stroke="#4d6bfe" stroke-width="5"/>
    </g>
  </g>

  <text x="230" y="126" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace"
        font-size="38" font-weight="700" fill="#16204a" letter-spacing="-0.6">dsh-serverchan-watchdog</text>
  <text x="230" y="171" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="23" font-weight="600" fill="#3d4468">Server酱推送小助手 · DSH 人工确认超时提醒</text>
  <text x="230" y="211" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="16" fill="#7c84a8">审批 · 计划评审 · 问答 — 浏览器关闭后仍由主机监控</text>
  <text x="230" y="239" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="16" fill="#7c84a8">host-side mobile alerts via ServerChan</text>

  <g font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" filter="url(#soft-shadow)">
    <rect x="810" y="115" width="92" height="90" rx="18" fill="#fff" stroke="#cfd9fb"/>
    <text x="856" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#4d6bfe">DSH</text>
    <text x="856" y="181" text-anchor="middle" font-size="17" font-weight="650" fill="#3d4468">等待</text>

    <rect x="954" y="115" width="92" height="90" rx="18" fill="#fff" stroke="#cfd9fb"/>
    <circle cx="1000" cy="148" r="15" fill="none" stroke="#4d6bfe" stroke-width="3"/>
    <path d="M1000 138v11l7 4" fill="none" stroke="#4d6bfe" stroke-width="3" stroke-linecap="round"/>
    <text x="1000" y="181" text-anchor="middle" font-size="17" font-weight="650" fill="#3d4468">超时</text>

    <rect x="1098" y="115" width="72" height="90" rx="18" fill="#4d6bfe"/>
    <path d="M1121 138h26v27h-26zM1127 132h14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1134" cy="171" r="2" fill="#fff"/>
    <text x="1134" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">提醒</text>
  </g>

  <g fill="none" stroke="#4d6bfe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.58">
    <path d="M914 160h27m-8-8 9 8-9 8"/>
    <path d="M1058 160h27m-8-8 9 8-9 8"/>
  </g>
</svg>
